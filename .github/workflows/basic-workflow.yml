
name: Basic CI Workflow

on:
  push:
    branches:
      - main
      - feature/linux-practice
  workflow_dispatch:

jobs:
  practice:
    runs-on: ubuntu-latest
    environment: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display message
        run: echo "GitHub Actions is working!"

      - name: Check repository
        run: echo "Repository checkout completed."

      - name: Check environment secret
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$DEMO_API_TOKEN" ]; then
            echo "Practice secret is available."
          else
            echo "Practice secret is missing."
            exit 1
          fi
